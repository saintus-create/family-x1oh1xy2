<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-label="California State Capitol building">
  <rect width="480" height="340" fill="#FAFAFA"/>
  <!-- ground / steps -->
  <rect x="60" y="300" width="360" height="14" rx="4" fill="#E8EAED"/>
  <rect x="90" y="284" width="300" height="14" rx="4" fill="#DADCE0"/>
  <!-- wings -->
  <rect x="70" y="210" width="120" height="74" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <rect x="290" y="210" width="120" height="74" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <!-- columns left -->
  <g stroke="#1A73E8" stroke-width="3">
    <line x1="92" y1="222" x2="92" y2="280"/>
    <line x1="118" y1="222" x2="118" y2="280"/>
    <line x1="144" y1="222" x2="144" y2="280"/>
    <line x1="170" y1="222" x2="170" y2="280"/>
  </g>
  <!-- columns right -->
  <g stroke="#1A73E8" stroke-width="3">
    <line x1="310" y1="222" x2="310" y2="280"/>
    <line x1="336" y1="222" x2="336" y2="280"/>
    <line x1="362" y1="222" x2="362" y2="280"/>
    <line x1="388" y1="222" x2="388" y2="280"/>
  </g>
  <!-- central rotunda -->
  <rect x="200" y="150" width="80" height="134" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <g stroke="#1A73E8" stroke-width="3">
    <line x1="216" y1="166" x2="216" y2="276"/>
    <line x1="240" y1="166" x2="240" y2="276"/>
    <line x1="264" y1="166" x2="264" y2="276"/>
  </g>
  <!-- dome -->
  <path d="M200 150 Q240 70 280 150 Z" fill="#FFFFFF" stroke="#1A73E8" stroke-width="3"/>
  <circle cx="240" cy="96" r="8" fill="#FBBC04"/>
  <rect x="232" y="60" width="16" height="20" rx="4" fill="#EA4335"/>
</svg>
