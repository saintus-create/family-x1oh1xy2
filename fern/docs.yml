# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: https://family.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: saintus-create
        repo: family-x1oh1xy2
        branch: main
      launch: dashboard
title: California Family Code
layout:
  searchbar-placement: header
  page-width: wide
  tabs-placement: header
tabs:
  code:
    display-name: Family Code
    icon: docs/assets/icon-circle.svg
navigation:
  - tab: code
    layout:
      - section: Family Code
        contents:
          - page: Home
            path: docs/pages/home.mdx
            icon: home
          - page: Division 1 — Preliminary Provisions and Definitions
            path: docs/pages/preliminary-provisions.mdx
            icon: book-open
          - page: Division 2 — General Provisions
            path: docs/pages/marriage.mdx
            icon: file-text
          - page: Division 2.5 — Domestic Partner Registration
            path: docs/pages/division-2.5-domestic-partners.mdx
            icon: heart
          - page: Division 3 — Marriage
            path: docs/pages/division-3-marriage.mdx
            icon: ring
          - page: Division 4 — Rights and Obligations During Marriage
            path: docs/pages/division-4-rights-during-marriage.mdx
            icon: scale
          - page: Division 5 — Conciliation Proceedings
            path: docs/pages/division-5-conciliation.mdx
            icon: handshake
          - page: Division 6 — Nullity, Dissolution, and Legal Separation
            path: docs/pages/division-6-dissolution.mdx
            icon: file-x
          - page: Division 7 — Division of Property
            path: docs/pages/division-7-property.mdx
            icon: house
          - page: Division 8 — Custody of Children
            path: docs/pages/division-8-custody.mdx
            icon: baby
          - page: Division 9 — Support
            path: docs/pages/division-9-support.mdx
            icon: dollar-sign
          - page: Division 10 — Prevention of Domestic Violence
            path: docs/pages/division-10-domestic-violence.mdx
            icon: shield
          - page: Division 11 — Minors
            path: docs/pages/division-11-minors.mdx
            icon: user
          - page: Division 12 — Parent and Child Relationship
            path: docs/pages/division-12-parent-child.mdx
            icon: users
          - page: Division 13 — Adoption
            path: docs/pages/division-13-adoption.mdx
            icon: heart
          - page: Division 14 — Family Law Facilitator Act
            path: docs/pages/division-14-family-law-facilitator.mdx
            icon: briefcase
          - page: Division 17 — Support Services
            path: docs/pages/division-17-support-services.mdx
            icon: heart-handshake
          - page: Division 20 — Pilot Projects
            path: docs/pages/division-20-pilot-projects.mdx
            icon: flask-conical
colors:
  accent-primary:
    light: "#000000"
    dark: "#ffffff"
  background:
    light: "#ffffff"
    dark: "#0a0a0a"
  border:
    light: "#e5e5e5"
    dark: "#2a2a2a"
theme:
  page-actions: toolbar
  footer-nav: minimal
favicon: docs/assets/favicon.svg
landing-page:
  page: Home
  path: docs/pages/home.mdx
  slug: /
css:
  - styles.css
typography:
  headingsFont:
    name: Public Sans
    weight: 700
  bodyFont:
    name: Public Sans
    weight: 400
  fontSize:
    base: 17px
    headings:
      h1: 2rem
      h2: 1.5rem
      h3: 1.25rem
  lineHeight:
    body: 1.7
    headings: 1.25
  letterSpacing:
    headings: 0.01em
ai-search:
  location:
    - docs
