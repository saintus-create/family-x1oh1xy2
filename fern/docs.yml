# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: family.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: family-x1oh1xy2
        branch: main
      launch: dashboard
title: California Family Code | Interactive Edition
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  code:
    display-name: Family Code
    icon: scale-balanced
  API Reference:
    display-name: Family Code API
    icon: database
navigation:
  - tab: code
    layout:
      - section: Family Code
        contents:
          - page: Preliminary Provisions
            path: docs/pages/preliminary-provisions.mdx
            icon: fa-solid fa-scroll
          - page: Definitions & Indian Children
            path: docs/pages/division-1-definitions.mdx
            icon: fa-solid fa-book-bookmark
          - page: General Provisions
            path: docs/pages/division-2-general.mdx
            icon: fa-solid fa-gear
          - page: Domestic Partner Registration
            path: docs/pages/division-2.5-domestic-partners.mdx
            icon: fa-solid fa-heart-circle-check
          - page: Marriage
            path: docs/pages/division-3-marriage.mdx
            icon: fa-solid fa-ring
          - page: Rights During Marriage
            path: docs/pages/division-4-rights-during-marriage.mdx
            icon: fa-solid fa-circle-nodes
          - page: Conciliation Proceedings
            path: docs/pages/division-5-conciliation.mdx
            icon: fa-solid fa-comments
          - page: Dissolution
            path: docs/pages/division-6-dissolution.mdx
            icon: fa-solid fa-scale-unbalanced
          - page: Division of Property
            path: docs/pages/division-7-property.mdx
            icon: fa-solid fa-building-columns
          - page: Custody of Children
            path: docs/pages/division-8-custody.mdx
            icon: fa-solid fa-children
          - page: Support
            path: docs/pages/division-9-support.mdx
            icon: fa-solid fa-hand-holding-dollar
          - page: Prevention of Domestic Violence
            path: docs/pages/division-10-domestic-violence.mdx
            icon: fa-solid fa-shield-halved
          - page: Minors
            path: docs/pages/division-11-minors.mdx
            icon: fa-solid fa-child
          - page: Parent and Child Relationship
            path: docs/pages/division-12-parent-child.mdx
            icon: fa-solid fa-people-roof
          - page: Adoption
            path: docs/pages/division-13-adoption.mdx
            icon: fa-solid fa-people-arrows
          - page: Family Law Facilitator Act
            path: docs/pages/division-14-family-law-facilitator.mdx
            icon: fa-solid fa-headset
          - page: Support Services
            path: docs/pages/division-17-support-services.mdx
            icon: fa-solid fa-building-columns
          - page: Pilot Projects
            path: docs/pages/division-20-pilot-projects.mdx
            icon: fa-solid fa-flask
          - page: Forms
            path: docs/pages/forms.mdx
            icon: fa-solid fa-file-lines
          - page: Judicial Decisions
            path: docs/pages/case-law.mdx
            icon: fa-solid fa-scale-balanced
      - section: Docs Toolkit
        contents:
          - page: Components reference
            path: docs/pages/components.mdx
            icon: fa-solid fa-cubes
          - page: Developer guide
            path: docs/pages/developer-guide.mdx
            icon: fa-solid fa-code
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-solid fa-headset
  - tab: API Reference
    layout:
      - section: Overview
        contents:
          - page: Family Code API
            path: docs/pages/api-reference-overview.mdx
            icon: fa-duotone fa-book
      - api: Family Code API - OpenAPI 3.1
        api-name: example-openapi
      - api: Family Code Realtime
        api-name: example-asyncapi
navbar-links:
  - type: filled
    text: Read the source
    url: https://leginfo.legislature.ca.gov/faces/codesTOCSelected.xhtml?tocCode=FAM
colors:
  accent-primary:
    light: "#1D4ED8"
    dark: "#60A5FA"
  background:
    light: "#FFFFFF"
    dark: "#0A0A0A"
  border:
    light: "#9CA3AF"
    dark: "#3F3F46"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://leginfo.legislature.ca.gov/faces/codesTOCSelected.xhtml?tocCode=FAM
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
