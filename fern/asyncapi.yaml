asyncapi: 3.0.0
info:
  title: Family Code Realtime
  version: 1.0.0
  description: >
    Real-time stream of amendments to the California Family Code. Subscribe to be
    notified the moment a section is enacted, amended, or repealed by the Legislature.
defaultContentType: application/json
servers:
  familyCodeWs:
    host: ws.familycode.ca.gov
    protocol: wss
    description: WebSocket server for Family Code update events.
channels:
  sectionUpdates:
    address: /ws/sections
    title: Section update stream
    description: >
      Connect to receive real-time Family Code amendment events as they are
      published by the Legislative Counsel.
    parameters:
      Authorization:
        description: Bearer token for authentication.
        location: $message.header#/Authorization
      division:
        description: Comma-separated division numbers to filter (e.g., 3,9).
        location: $message.header#/division
    messages:
      sectionAmended:
        name: SectionAmended
        title: A section was amended
        payload:
          type: object
          properties:
            sectionNumber:
              type: string
              description: The amended section, e.g. "4055".
            division:
              type: integer
            changeType:
              type: string
              enum: [enacted, amended, repealed]
            effectiveDate:
              type: string
              format: date
            summary:
              type: string
              description: Short description of the change.
